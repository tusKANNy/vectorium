[package]
name = "vectorium"
version = "0.11.1"
edition = "2024"
authors = [
    "Rossano Venturini <rossano.venturini@unipi.it>"]
readme = "README.md"
description = "Dense, sparse and multivector embedding datasets with compression utilities and brute-force parallel search."
license = "MIT"

[dependencies]
indicatif = { version = "0.17.11", features = ["rayon"], optional = true }
serde = { version = "1.0", features = ["derive"] }
bincode = { version = "2.0", features = ["serde"] }
clap = { version = "4.5", features = ["derive"], optional = true }
rayon = "1.11"
# TODO: f16 available in nightly, but not supported by crates: https://github.com/rust-num/num-traits/pull/333
half = { version = "2.6", features = [
    "bytemuck",
    "serde",
    "std",
    "num-traits",
] }
ndarray = "0.16"
ndarray-npy = {version = "0.9", default-features = false}
# TODO: use upstream when https://gitlab.com/tspiteri/fixed/-/issues/69 is fixed
# If it's not getting fixed, prefer using a git patch when https://github.com/rust-lang/cargo/issues/4648 is fixed
fixed = { git = "https://gitlab.com/tinozzo123/fixed", rev = "e7d72487b9da972d3ed7aec7bc32c12cd8881994", features = ["num-traits", "serde"] }
num-traits = "0.2.19"
itertools = "0.14.0"
bytemuck = { version = "1.23", features = [
    "min_const_generics",
] }
rusty-perm = "0.2.0"
rgb = { package = "rgbisect", version = "0.1.0" }
rand = "0.8"
matrixmultiply = "0.3"
faer = "0.19"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[features]
default = []
# Enables multivector types (DenseMultiVectorView/Owned, MultiVectorDataset, multivec encoders).
multivec = []
# Enables the optional command-line utilities under `src/bin/` that depend on clap/indicatif.
cli = ["dep:clap", "dep:indicatif"]

[[bin]]
name = "compute_groundtruth"
path = "src/bin/compute_groundtruth.rs"
required-features = ["cli"]

[[bin]]
name = "kmeans_bench"
path = "src/bin/kmeans_bench.rs"
required-features = ["cli"]


[profile.release]
opt-level = 3
debug = true
lto = true
